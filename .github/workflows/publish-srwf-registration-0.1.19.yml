name: Publish SRWF Registration 0.1.19

on:
  push:
    branches:
      - release/srwf-registration-v0.1.19-publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: 4e5727ec3573bc08395c43a99312f157f062a347
      TAG: srwf-registration-v0.1.19
      TITLE: "SRWF Registration 0.1.19 — Minimal Production Release"
      EXPECTED_SHA256: e31c11dfb75131e1cc99cab0f4f0da484ee9c238eaa36443766570ad508728ef
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: 4e5727ec3573bc08395c43a99312f157f062a347
          fetch-depth: 0

      - name: Verify, bind tag, and publish existing draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag conflict: $TAG already exists" >&2
            exit 1
          fi

          rm -rf release-dist release-download
          python3 themes/srwf-registration/tests/build_owner_test_packages.py release-dist
          cp release-dist/gtb-srwf-registration-owner-test-0.1.19.zip release-dist/gtb-srwf-registration-0.1.19.zip
          cmp release-dist/gtb-srwf-registration-owner-test-0.1.19.zip release-dist/gtb-srwf-registration-0.1.19.zip
          actual_sha="$(sha256sum release-dist/gtb-srwf-registration-0.1.19.zip | cut -d' ' -f1)"
          test "$actual_sha" = "$EXPECTED_SHA256"
          printf '%s  %s\n' "$actual_sha" 'gtb-srwf-registration-0.1.19.zip' > release-dist/GTB_SRWF_REGISTRATION_0.1.19_SHA256.txt
          unzip -t release-dist/gtb-srwf-registration-0.1.19.zip >/dev/null
          test "$(unzip -Z1 release-dist/gtb-srwf-registration-0.1.19.zip | grep -v '/$' | wc -l)" -eq 11
          if unzip -Z1 release-dist/gtb-srwf-registration-0.1.19.zip | grep -E '/(diagnostic|tests|reference)/'; then
            echo 'Forbidden non-production content found in release ZIP' >&2
            exit 1
          fi

          published=0
          cleanup() {
            status=$?
            if [ "$published" -ne 1 ]; then
              stale_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "srwf-registration-v0.1.19" and .draft == true) | .id' | head -n1 || true)"
              if [ -n "$stale_id" ]; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$stale_id" >/dev/null 2>&1 || true
              fi
              git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          git tag "$TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$TAG"
          test "$(git ls-remote origin "refs/tags/$TAG" | cut -f1)" = "$RELEASE_SHA"

          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "srwf-registration-v0.1.19" and .draft == true) | .id' | head -n1)"
          test -n "$release_id"

          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.name')" = "$TITLE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.target_commitish')" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.prerelease')" = 'false'

          expected_assets="$(printf '%s\n%s\n' 'GTB_SRWF_REGISTRATION_0.1.19_SHA256.txt' 'gtb-srwf-registration-0.1.19.zip' | sort)"
          actual_assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[].name' | sort)"
          test "$actual_assets" = "$expected_assets"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[] | select(.name == "gtb-srwf-registration-0.1.19.zip") | .digest')" = "sha256:$EXPECTED_SHA256"

          mkdir release-download
          zip_asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[] | select(.name == "gtb-srwf-registration-0.1.19.zip") | .id')"
          sum_asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[] | select(.name == "GTB_SRWF_REGISTRATION_0.1.19_SHA256.txt") | .id')"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$zip_asset_id" > release-download/gtb-srwf-registration-0.1.19.zip
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$sum_asset_id" > release-download/GTB_SRWF_REGISTRATION_0.1.19_SHA256.txt
          test "$(sha256sum release-download/gtb-srwf-registration-0.1.19.zip | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          test "$(cat release-download/GTB_SRWF_REGISTRATION_0.1.19_SHA256.txt)" = "$EXPECTED_SHA256  gtb-srwf-registration-0.1.19.zip"

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false >/dev/null

          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.draft')" = 'false'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.prerelease')" = 'false'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.name')" = "$TITLE"
          test "$(git ls-remote origin "refs/tags/$TAG" | cut -f1)" = "$RELEASE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.html_url'

          published=1
          trap - EXIT
